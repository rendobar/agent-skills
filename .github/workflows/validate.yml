name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skill validates against the Agent Skills spec
        run: |
          set -euo pipefail
          for d in skills/*/; do
            npx -y skills-ref validate "./${d%/}"
          done

      # The spec allows exactly six frontmatter keys. Claude Code tolerates more,
      # but claude.ai upload, the Skills API, and package_skill.py HARD ERROR on
      # any extra key, so a skill that works locally can be unpublishable. A
      # well-known vendor skill ships `inputs:` and `references:` and has exactly
      # this defect. Put anything custom under `metadata:`, which is a spec-legal
      # arbitrary string map.
      - name: Frontmatter uses only spec-legal keys
        run: |
          set -euo pipefail
          allowed='name|description|license|compatibility|metadata|allowed-tools'
          fail=0
          for f in skills/*/SKILL.md; do
            keys=$(awk '/^---$/{n++; next} n==1 && /^[a-zA-Z-]+:/{sub(/:.*/,""); print} n>=2{exit}' "$f")
            for k in $keys; do
              if ! printf '%s' "$k" | grep -qE "^($allowed)$"; then
                echo "::error file=$f::frontmatter key '$k' is not spec-legal. Allowed: $allowed. Nest custom data under metadata:"
                fail=1
              fi
            done
            # name must equal the parent directory name (spec requirement)
            dir=$(basename "$(dirname "$f")")
            name=$(awk '/^name:/{print $2; exit}' "$f")
            if [ "$dir" != "$name" ]; then
              echo "::error file=$f::name '$name' must match directory '$dir'"
              fail=1
            fi
            echo "checked $f"
          done
          exit $fail

      # References must stay one level deep. Deep chains are the documented
      # anti-pattern: the agent burns context walking them.
      - name: References are one level deep
        run: |
          set -euo pipefail
          if find skills/*/references -mindepth 2 -type f 2>/dev/null | grep .; then
            echo "::error::reference files must sit directly in references/, not in subdirectories"
            exit 1
          fi
          echo "references are flat"

      - name: Evals exist
        run: |
          set -euo pipefail
          for d in skills/*/; do
            name=$(basename "${d%/}")
            if [ ! -f "skill-evals/$name/evals.json" ]; then
              echo "::error::skill '$name' has no skill-evals/$name/evals.json"
              exit 1
            fi
            node -e "JSON.parse(require('fs').readFileSync('skill-evals/$name/evals.json','utf8'))"
            echo "evals ok for $name"
          done

      - name: Cited URLs return 200
        run: |
          set -uo pipefail
          # Skipped URLs:
          #  - api.rendobar.com/mcp answers 401 to an unauthenticated GET by design
          #  - api.rendobar.com/jobs and /assets are authenticated POST endpoints
          #  - anything ending in / is a {placeholder} template fragment
          skip='^https://api\.rendobar\.com/(mcp|jobs|assets)$'
          urls=$(grep -rhoE 'https://[A-Za-z0-9./_%-]+' --include='*.md' README.md skills/ \
            | sed 's/[.,)]*$//' | sort -u)
          fail=0
          for u in $urls; do
            case "$u" in */) echo "skip     $u"; continue ;; esac
            if printf '%s' "$u" | grep -qE "$skip"; then
              echo "skip     $u"
              continue
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 --retry 2 \
              -A 'rendobar-agent-skills-ci' "$u")
            if [ "${code:0:1}" = "2" ]; then
              echo "ok  $code $u"
            else
              echo "::error::$code $u"
              fail=1
            fi
          done
          exit $fail
